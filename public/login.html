<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F8">
<title>ONNON - 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <main class="auth-wrap">
    <h1 style="text-align:center;">ONNON</h1>
    <p class="lede" style="text-align:center;">오늘의 논술 - 오논</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin">로그인</button>
      <button class="auth-tab" id="tabSignup">회원가입</button>
    </div>

    <p class="field-label">이메일</p>
    <input class="text-input" id="emailInput" type="email" autocomplete="email" placeholder="you@example.com">
    <p class="field-label">비밀번호</p>
    <input class="text-input" id="pwInput" type="password" autocomplete="current-password" placeholder="6자 이상">

    <p class="auth-msg" id="msg"></p>

    <button class="primary-btn" id="submitBtn">로그인</button>
  </main>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
let mode = 'login';
const tabLogin = document.getElementById('tabLogin');
const tabSignup = document.getElementById('tabSignup');
const submitBtn = document.getElementById('submitBtn');
const msg = document.getElementById('msg');

function setMode(m){
  mode = m;
  tabLogin.classList.toggle('active', m==='login');
  tabSignup.classList.toggle('active', m==='signup');
  submitBtn.textContent = m==='login' ? '로그인' : '회원가입';
  msg.textContent = '';
}
tabLogin.onclick = () => setMode('login');
tabSignup.onclick = () => setMode('signup');

// 이미 로그인되어 있으면 바로 메인으로
refreshSessionIfNeeded().then(s => { if(s) location.href = 'index.html'; });

submitBtn.onclick = async () => {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('pwInput').value;
  if(!email || password.length < 6){
    msg.textContent = '이메일과 6자 이상의 비밀번호를 입력해 주세요.';
    return;
  }
  submitBtn.disabled = true;
  msg.textContent = '';
  try{
    if(mode === 'signup'){
      const data = await signUp(email, password);
      if(!data.access_token){
        msg.textContent = '가입 완료! 이메일 인증이 필요하다면 메일함을 확인해 주세요. 인증 후 로그인해 주세요.';
        setMode('login');
        submitBtn.disabled = false;
        return;
      }
    } else {
      await signIn(email, password);
    }
    location.href = 'index.html';
  }catch(e){
    msg.textContent = e.message || '오류가 발생했어요.';
    submitBtn.disabled = false;
  }
};
</script>
</body>
</html>
